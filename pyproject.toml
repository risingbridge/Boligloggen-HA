[project]
name = "boligloggen-ha"
version = "0.3.0"
description = "Boligloggen – home maintenance plan for Home Assistant"
requires-python = ">=3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Norwegian text uses en dashes etc.

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["planner", "planner.*", "custom_components.boligloggen.planner.*"]
strict = true

[tool.ruff.lint.per-file-ignores]
"script/*" = ["E501"]
